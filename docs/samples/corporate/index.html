<main id="top">

        <p class="lead" id="lead"></p>
        <div class="ctas" id="ctas"></div>
        <ul class="facts" id="facts"></ul>

    </div>

  <section id="concerns" aria-labelledby="issues-h">

    </div>

  <section class="tint" id="features" aria-labelledby="features-h">
    <div class="wrap">

      <div class="features" id="feature-list"></div>

  <section id="flow" aria-labelledby="flow-h">

      <ol class="steps" id="steps"></ol>

  </section>

  <section class="tint" id="info" aria-labelledby="info-h">
    <div class="wrap info">
      <div>

        <p class="sec-lead" id="info-lead" style="margin-bottom:0"></p>
      </div>
      <table id="info-table"></table>
      <div id="aside-info" class="aside-info" hidden></div>
    </div>
  </section>

  <section id="faq" class="faq" aria-labelledby="faq-h">
    <div class="wrap">
      <h2 id="faq-h">よくある質問</h2>
      <div id="faq-list"></div>
    </div>
  </section>

  <section class="contact" id="contact" aria-labelledby="contact-h">
    <div class="wrap">
      <div id="contact-text"><h2 id="contact-h"></h2></div>
      <form id="form" novalidate></form>
    </div>
  </section>
</main>

<footer>

        title: "空室状況", meta: "十二月",
        rows: [["12/5（金）川沿いの和室", "二名様より", "残り一室", "warn"], ["12/6（土）露天風呂付き客室", "二名様より", "満室", "plain"], ["12/11（木）川沿いの和室", "一名様でも", "空室あり", "ok"], ["12/12（金）離れ", "四名様まで", "空室あり", "ok"]],
        foot: ["女将", "しずく", "お電話でも承ります"],
      },
      issues: { h: "こんな旅に、どうぞ", lead: "何もしない時間を楽しむための宿です。",
        items: [["ふたりで静かに過ごしたい", "館内に大きな音の出る設備はありません。夜は川の音だけが聞こえます。"], ["ひとり旅でゆっくりしたい", "平日はおひとり様でもお泊まりいただけます。本を持っていらっしゃる方が多い宿です。"], ["家族の節目を祝いたい", "離れの客室は四名様まで。記念日には、ささやかなお祝いをご用意します。"]] },
      features: { h: "宿のこだわり", lead: "八室だからこそ、ひとつひとつに手をかけられます。",
        items: [["steam", "源泉かけ流しの湯", "加水も加温もしない湯を、大浴場と露天風呂に引いています。夜通し入っていただけます。"], ["bowl", "その日の山と川の夕餉", "近くの畑と川でとれたものを中心に、品数を絞って、温かいものは温かいうちにお出しします。"], ["bed", "八室だけの静かな客室", "すべての客室から川が見えます。テレビは置かず、代わりに本を数冊ご用意しています。"], ["car", "駅からの送迎", "最寄りの駅まで、お迎えにあがります。ご到着の時刻をお知らせください。"]] },
      flow: { h: "ご予約から当日まで", lead: "ご不明な点は、いつでもお気軽にお尋ねください。",
        items: [["お問い合わせ", "ご希望の日にちと人数を、下のフォームまたはお電話でお知らせください。", "空室を確認してご連絡"], ["ご予約の確定", "お部屋とお食事の内容を決めて、ご予約を確定します。", "アレルギーもこの時に"], ["前日のご連絡", "到着のお時間と、送迎の有無を確認させていただきます。", "前日の夕方"], ["ご到着", "駅または宿でお迎えします。お茶とお菓子でひと休みを。", "チェックイン 15時から"]] },
      info: { h: "宿のご案内", lead: "山あいの小さな宿です。お越しの際は、時間に余裕を持っておいでください。",
        rows: [["チェックイン／アウト", "15:00〜18:00 ／ 〜11:00"], ["客室", "和室5室、露天風呂付き客室2室、離れ1棟"], ["温泉", "大浴場・露天風呂（夜通し入浴いただけます）"], ["所在地", "架空の宿のため、住所はありません"], ["送迎", "最寄り駅から無料送迎（要予約）"]] },
      faq: [["ひとりでも泊まれますか", "平日はおひとり様でもお泊まりいただけます。週末は二名様からのご案内です。"], ["食事の時間は選べますか", "夕食は17時半または19時からお選びいただけます。お部屋ではなく、食事処でお出しします。"], ["子ども連れでも泊まれますか", "小学生以上のお子さまからお泊まりいただけます。離れのお部屋がおすすめです。"], ["キャンセルはいつまでできますか", "ご予約の確定時に、キャンセルの期限をお知らせします。お早めにご連絡ください。"]],
      contact: { h: "ご予約・お問い合わせ", text: ["ご希望の宿泊日と人数をお知らせください。空室を確認して、ご連絡いたします。", "お返事は、翌日までにお送りします。"],
        fields: [["name", "お名前", "name", "お名前を入力してください。"], ["when", "ご希望の宿泊日", "off", "ご希望の宿泊日を入力してください（例：12月11日から1泊）。"]],
        emailErr: "メールアドレスを正しい形式で入力してください（例：name@example.com）。",
        select: ["ご人数", ["1名", "2名", "3名", "4名"]],
        agree: "いただいた情報は、ご予約のご連絡にのみ使用します。", submit: "空室を問い合わせる" },
      foot: "湯宿 しずく（架空の宿です）",
    },
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const sectionOrder = {
    b2b: ["concerns", "features", "flow", "info", "faq"],
    cafe: ["info", "features", "concerns", "flow", "faq"],
    kids: ["features", "info", "flow", "concerns", "faq"],
    dental: ["info", "flow", "features", "concerns", "faq"],
    builder: ["features", "info", "concerns", "flow", "faq"],
    ryokan: ["features", "concerns", "info", "faq", "flow"],
  };

  function render(key) {
    const P = PATTERNS[key];
    document.documentElement.dataset.theme = key;
    document.title = P.title;

    $("logo").setAttribute("aria-label", P.logo.name + " トップ");
    $("logo").innerHTML = '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">' + P.logo.mark + '</svg><span><b>' + esc(P.logo.name) + '</b><small>' + esc(P.logo.company) + '</small></span>';
    $("nav").innerHTML = P.nav.map(([h, t]) => '<a href="' + h + '">' + esc(t) + "</a>").join("") + '<a class="btn primary" href="#contact">' + esc(P.navCta) + "</a>";

    $("h1").innerHTML = P.h1.map((t) => "<span>" + esc(t) + "</span>").join("");
    $("lead").textContent = P.lead;
    $("ctas").innerHTML = P.ctas.map(([h, t, c]) => '<a class="btn ' + c + '" href="' + h + '">' + esc(t) + "</a>").join("");
    $("facts").innerHTML = P.facts.map((t) => "<li>" + esc(t) + "</li>").join("");

    $("photo").src = "img/" + key + ".webp";

    const D = P.device;
    const device = $("device");
    const inHero = key === "b2b";
    const asideInfo = $("aside-info");
    (inHero ? document.querySelector(".visual") : asideInfo).append(device);
    asideInfo.hidden = inHero;
    const main = $("top");
    sectionOrder[key].forEach((id) => main.insertBefore($(id), $("contact")));
    device.innerHTML = '<header class="device-head"><h2 id="device-title">' + esc(D.title) + '</h2><span>' + esc(D.meta) + '</span></header><ul class="checks">' +
      D.rows.map(([a, b, tag, k]) => "<li><span>" + esc(a) + "<small>" + esc(b) + '</small></span><span class="tag ' + k + '">' + esc(tag) + "</span></li>").join("") +
      '</ul><div class="foot"><span>' + esc(D.foot[0]) + '</span><span class="sign">' + esc(D.foot[1]) + "</span><span>" + esc(D.foot[2]) + "</span></div>";

    $("issues-h").textContent = P.issues.h; $("issues-lead").textContent = P.issues.lead;
    $("issues").innerHTML = P.issues.items.map(([h, p]) => "<div><h3>" + esc(h) + "</h3><p>" + esc(p) + "</p></div>").join("");

    $("features-h").textContent = P.features.h; $("features-lead").textContent = P.features.lead;
    $("feature-list").innerHTML = P.features.items.map(([ic, h, p]) => '<div class="feature"><svg viewBox="0 0 48 48" aria-hidden="true">' + ICON[ic] + "</svg><div><h3>" + esc(h) + "</h3><p>" + esc(p) + "</p></div></div>").join("");

    $("flow-h").textContent = P.flow.h; $("flow-lead").textContent = P.flow.lead;
    $("steps").innerHTML = P.flow.items.map(([h, p, t]) => "<li><h3>" + esc(h) + "</h3><p>" + esc(p) + '</p><span class="term">' + esc(t) + "</span></li>").join("");

    $("info-h").textContent = P.info.h; $("info-lead").textContent = P.info.lead;
    $("info-table").innerHTML = P.info.rows.map(([k, v]) => '<tr><th scope="row">' + esc(k) + "</th><td>" + esc(v) + "</td></tr>").join("");

    $("faq-list").innerHTML = P.faq.map(([q, a]) => "<details><summary>" + esc(q) + "</summary><p>" + esc(a) + "</p></details>").join("");

    const C = P.contact;
    $("contact-text").innerHTML = '<h2 id="contact-h">' + esc(C.h) + "</h2>" + C.text.map((t) => "<p>" + esc(t) + "</p>").join("");
    $("form").innerHTML =
      C.fields.map(([id, label, ac, err]) => '<div class="field"><label for="' + id + '">' + esc(label) + '<span class="req">必須</span></label><input id="' + id + '" name="' + id + '" autocomplete="' + ac + '" aria-describedby="' + id + '-error" required><div class="err" id="' + id + '-error">' + esc(err) + "</div></div>").join("") +
      '<div class="field"><label for="email">メールアドレス<span class="req">必須</span></label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required><div class="err" id="email-error">' + esc(C.emailErr) + "</div></div>" +
      '<div class="field"><label for="opt">' + esc(C.select[0]) + '</label><select id="opt" name="opt"><option value="">選択してください</option>' + C.select[1].map((o) => "<option>" + esc(o) + "</option>").join("") + "</select></div>" +
      '<p class="agree">' + esc(C.agree) + '</p><button class="btn primary" type="submit">' + esc(C.submit) + '</button><div class="done" id="done" role="status">入力内容を確認しました。これは制作サンプルのため、実際には送信されません。</div>';
    bindForm(C.fields.map((f) => f[0]));

    $("foot-name").textContent = P.foot;
    [...$("pick").querySelectorAll("button")].forEach((b) => {
      const on = b.dataset.key === key;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function bindForm(required) {
    const form = $("form"), done = $("done");
    const rules = {};
    required.forEach((n) => (rules[n] = (v) => v.trim().length > 0));
    rules.email = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    const check = (el) => {
      const ok = rules[el.name](el.value);
      el.closest(".field").classList.toggle("invalid", !ok);
      el.setAttribute("aria-invalid", ok ? "false" : "true");
      return ok;
    };
    Object.keys(rules).forEach((n) => {
      const el = form.elements[n];
      el.addEventListener("blur", (e) => check(e.target));
      // 入力中に正しくなった時点でエラー表示を消す（送信ボタンを押す瞬間に表示が動いて押し損ねないように）
      el.addEventListener("input", () => { if (rules[n](el.value)) check(el); });
    });
    form.onsubmit = (e) => {
      e.preventDefault();
      let first = null;
      Object.keys(rules).forEach((n) => { const el = form.elements[n]; if (!check(el) && !first) first = el; });
      if (first) { first.focus(); done.classList.remove("show"); return; }
      done.classList.add("show");
    };
  }

  // 切り替えボタン
  const pick = $("pick");
  pick.setAttribute("role", "group"); pick.setAttribute("aria-labelledby", "pick-label");
  Object.keys(PATTERNS).forEach((k) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.key = k; b.textContent = PATTERNS[k].label;
    b.addEventListener("click", () => {
      render(k);
      const url = new URL(location.href);
      if (k === "b2b") url.searchParams.delete("pattern"); else url.searchParams.set("pattern", k);
      history.replaceState(null, "", url);
    });
    pick.appendChild(b);
  });

  const initial = new URLSearchParams(location.search).get("pattern");
  render(Object.hasOwn(PATTERNS, initial) ? initial : "b2b");
})();
</script>
</body>
</html>
