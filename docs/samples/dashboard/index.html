<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3CM4YZ8E9Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    window.dataLayer.push(arguments);
  }
  gtag("js", new Date());
  gtag("config", "G-3CM4YZ8E9Y");

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>監視ボード（制作サンプル）</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div>監視ボード<small>制作サンプル</small></div></div>
    <nav aria-label="メニュー">
      <a href="#top" aria-current="location">概要</a>
      <a href="#alerts">アラート <span class="count" id="nav-count" hidden>0</span></a>
      <a href="#jobs">定期実行</a>
    </nav>
    <p class="back"><a href="../../index.html">ポートフォリオに戻る</a></p>
  </aside>

  <main id="top">
    <header class="topbar">
      <div>
        <h1>監視の概要</h1>
        <p class="meta">最終更新 本日 9:00</p>
      </div>
      <p class="notice">サンプルデータ</p>
    </header>

    <div class="kpis" role="group" aria-label="監視の集計">
      <div class="kpi"><div class="k">監視対象</div><div class="v">3<small>サイト</small></div><div class="d">毎日 9:00 に判定</div></div>
      <a class="kpi attn" id="k-open-box" href="#alerts"><div class="k">未解決のアラート</div><div class="v" id="k-open" aria-live="polite">0</div><div class="d" id="k-open-d"></div></a>
      <a class="kpi" href="#jobs"><div class="k">本日の定期実行</div><div class="v" id="k-jobs">0</div><div class="d" id="k-jobs-d"></div></a>
      <div class="kpi"><div class="k">会員サイトの応答時間（本日）</div><div class="v" id="k-lat">0<small>ms</small></div><div class="d" id="k-lat-d"></div></div>
    </div>

    <section class="panel chart" aria-labelledby="chart-h">
      <header>
        <h2 id="chart-h">指標の推移</h2>
        <div class="tabs" role="tablist" aria-label="監視対象" id="tabs"></div>
      </header>
      <div class="chart-wrap" id="chart-panel" role="tabpanel" tabindex="0">
        <div class="chart-cap">
          <div><b id="chart-title"></b><p id="chart-range"></p></div>
          <ul class="legend" aria-label="凡例"><li><i class="actual"></i>実績</li><li><i class="usual"></i>基準範囲</li><li><i class="outlier"></i>範囲外</li></ul>
        </div>
        <canvas id="cv" role="img" aria-labelledby="chart-title" aria-describedby="chart-range chart-event"></canvas>
        <p id="chart-event" class="chart-event"></p>
      </div>
    </section>

    <div class="two">
      <section class="panel" id="alerts" aria-labelledby="alerts-h">
        <header>
          <h2 id="alerts-h">アラート</h2>
          <label class="filter"><span>表示</span><select id="alert-filter"><option value="all">すべて</option><option value="open">未解決のみ</option><option value="resolved">解決済みのみ</option></select></label>
        </header>
        <table>
          <thead><tr><th scope="col">検知日</th><th scope="col">対象と内容</th><th scope="col">状態</th></tr></thead>
          <tbody id="alert-rows"></tbody>
        </table>
        <p class="empty" id="alert-empty" hidden>該当するアラートはありません。</p>
      </section>

      <section class="panel" id="jobs" aria-labelledby="jobs-h">
        <header><h2 id="jobs-h">定期実行の履歴</h2></header>
        <table>
          <thead><tr><th scope="col">時刻</th><th scope="col">処理</th><th scope="col">結果</th></tr></thead>
          <tbody id="job-rows"></tbody>
        </table>
      </section>
    </div>
  </main>
</div>

<script src="../../demo.js"></script>
<script>
(function () {
  "use strict";
  const W = window.WatchDemo;
  const fmt = (v) => Math.round(v).toLocaleString("ja-JP");

  // 今日を基準に日付を振る（サンプル）
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const md = (d) => (d.getMonth() + 1) + "/" + d.getDate();

  // 監視対象（シフトは「異常の日が何日前か」をずらすため）
  const TARGETS = [
    { id: "reserve", site: "予約サイト", kind: "visits", seed: 101, shift: -9 },
    { id: "member", site: "会員サイト", kind: "latency", seed: 233, shift: -2 },
    { id: "apply", site: "申込みページ", kind: "visits", seed: 377, shift: -11 },
  ];
  TARGETS.forEach((t) => {
    const p = W.pick(t.seed, t.kind);
    t.series = p.series; t.hit = p.hit;
    // 画面上の最終日を「今日」にそろえるため、shift 日ぶん末尾を切る
    const cut = W.N + t.shift;
    t.vals = t.series.vals.slice(0, cut);
    t.bands = t.vals.map((_, d) => (d <= t.hit.day ? W.judge(t.series, d) : null));
    t.label = t.series.label.replace("Webサイトの", "") + "：" + t.site;
  });
  const lastDate = (t, d) => { const x = new Date(today); x.setDate(x.getDate() - (t.vals.length - 1 - d)); return x; };

  // ---- アラート ----
  const alerts = TARGETS.map((t) => {
    const v = t.series.vals[t.hit.day], j = t.hit.j;
    const text = t.kind === "visits"
      ? "アクセス数が同じ曜日の平均の " + Math.round(j.ratio * 100) + "% に減少（" + fmt(v) + "件）"
      : "応答時間が直近2週間の平均の " + j.ratio.toFixed(1) + " 倍（" + fmt(v) + "ms）";
    return { date: lastDate(t, t.hit.day), site: t.site, text };
  }).sort((a, b) => b.date - a.date);
  // 新しいものから 未対応 → 対応中 → 解決（サンプル）
  alerts.forEach((a, i) => { a.status = ["未対応", "対応中"][i] || "解決"; });
  // 過去の解決済みアラート（サンプル）
  alerts.push({ date: new Date(today.getTime() - 34 * 864e5), site: "予約サイト", text: "外部APIの応答なし（3回連続）", status: "解決" });

  const rowsEl = document.getElementById("alert-rows");
  const filter = document.getElementById("alert-filter");
  const empty = document.getElementById("alert-empty");

  alerts.forEach((a) => {
    const tr = document.createElement("tr");
    tr.dataset.status = a.status;
    tr.innerHTML = "<td class='num'>" + md(a.date) + "</td><td><strong>" + a.site + "</strong><small>" + a.text + "</small></td><td></td>";
    const select = document.createElement("select");
    select.setAttribute("aria-label", md(a.date) + " " + a.site + " のアラートの状態");
    ["未対応", "対応中", "解決"].forEach((status) => select.add(new Option(status, status)));
    select.value = a.status;
    select.addEventListener("change", () => {
      a.status = select.value;
      tr.dataset.status = a.status;
      applyFilter();
      if (tr.hidden) filter.focus();
      renderKpis();
    });
    tr.lastElementChild.append(select);
    rowsEl.append(tr);
  });

  function applyFilter() {
    for (const row of rowsEl.rows) {
      const resolved = row.dataset.status === "解決";
      row.hidden = (filter.value === "open" && resolved) || (filter.value === "resolved" && !resolved);
    }
    empty.hidden = [...rowsEl.rows].some((row) => !row.hidden);
  }

  filter.addEventListener("change", applyFilter);
  const navLinks = document.querySelectorAll(".sidebar nav a");
  function highlightSection() {
    const current = location.hash || "#top";
    navLinks.forEach((link) => {
      if (link.hash === current) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    });
  }
  window.addEventListener("hashchange", highlightSection);
  highlightSection();

  // ---- 定期実行（サンプルの履歴） ----
  const JOBS = [
    ["9:00", "アクセス数の取得（予約サイト）", "14秒", "ok"],
    ["9:00", "アクセス数の取得（申込みページ）", "11秒", "ok"],
    ["9:01", "応答時間の集計（会員サイト）", "6秒", "ok"],
    ["9:01", "外部APIからの在庫データ取得", "1回目失敗 → 再試行で成功", "retry"],
    ["9:02", "判定とアラートの作成", "3秒", "ok"],
    ["9:02", "Slack への通知", "1秒", "ok"],
    ["前日 9:00", "アクセス数の取得（予約サイト）", "13秒", "ok"],
    ["前日 9:01", "外部APIからの在庫データ取得", "応答なし（3回）", "ng"],
  ];
  const jobEl = document.getElementById("job-rows");
  const LABEL = { ok: "成功", retry: "再試行で成功", ng: "失敗" };
  JOBS.forEach(([t, name, dur, st]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td class='num'>" + t + "</td><td>" + name + "<small>" + dur + "</small></td><td><span class='pill " + st + "'>" + LABEL[st] + "</span></td>";
    jobEl.appendChild(tr);
  });

  // ---- KPI ----
  function renderKpis() {
    const open = alerts.filter((a) => a.status !== "解決");
    const unhandled = alerts.filter((a) => a.status === "未対応").length;
    document.getElementById("k-open").textContent = open.length;
    document.getElementById("k-open-d").textContent = "うち未着手 " + unhandled + "件";
    document.getElementById("k-open-box").classList.toggle("attn", open.length > 0);
    document.getElementById("nav-count").textContent = open.length;
    document.getElementById("nav-count").hidden = open.length === 0;
    const todayJobs = JOBS.filter((j) => !j[0].startsWith("前日"));
    const okJobs = todayJobs.filter((j) => j[3] !== "ng").length;
    document.getElementById("k-jobs").innerHTML = okJobs + "<small>/ " + todayJobs.length + "</small>";
    document.getElementById("k-jobs-d").textContent = "失敗 " + (todayJobs.length - okJobs) + "件、再試行 " + todayJobs.filter((j) => j[3] === "retry").length + "件";
    const m = TARGETS[1], lat = m.vals[m.vals.length - 1];
    const prev = m.vals.slice(-8, -1).reduce((a, b) => a + b, 0) / 7;
    document.getElementById("k-lat").innerHTML = fmt(lat) + "<small>ms</small>";
    document.getElementById("k-lat-d").textContent = "直近7日の平均 " + fmt(prev) + "ms";
  }

  // ---- グラフ ----
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const C = { ink: "#dafa9d", muted: "#c1d1c6", alert: "#ffa28b", band: "#3a594d", grid: "#38534a", marker: "#785247" };
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }
  let cur = 1;

  function draw() {
    const t = TARGETS[cur];
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const axisW = 62, padT = 9, padB = 24, pw = w - axisW, ph = h - padT - padB;
    if (pw < 1 || ph < 1) return;
    let lo = Infinity, hi = -Infinity;
    t.vals.forEach((v) => { lo = Math.min(lo, v); hi = Math.max(hi, v); });
    t.bands.forEach((b) => { if (b) { lo = Math.min(lo, b.lo); hi = Math.max(hi, b.hi); } });
    lo = Math.max(0, lo - (hi - lo) * 0.08); hi += (hi - lo) * 0.06;
    const n = t.vals.length, X = (i) => 8 + (i + 0.5) * ((pw - 10) / n), Y = (v) => padT + (hi - v) / (hi - lo) * ph;
    ctx.font = "12px 'BIZ UDPGothic', sans-serif"; ctx.fillStyle = C.muted; ctx.textBaseline = "middle";
    const step = niceStep((hi - lo) / 5);
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    for (let v = Math.ceil(lo / step) * step; v < hi; v += step) {
      const y = Y(v);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(pw, y);
      ctx.stroke();
      ctx.fillText(fmt(v) + t.series.unit, pw + 6, y);
    }
    ctx.textBaseline = "top";
    for (let i = n - 1; i >= 0; i -= w < 450 ? 21 : 14) {
      const label = md(lastDate(t, i));
      const labelWidth = ctx.measureText(label).width;
      const x = Math.max(0, Math.min(pw - labelWidth, X(i) - labelWidth / 2));
      ctx.fillText(label, x, padT + ph + 6);
    }
    ctx.fillStyle = C.band;
    for (let i = 0; i < n; i++) { const b = t.bands[i]; if (b) ctx.fillRect(X(i) - pw / n / 2, Y(b.hi), pw / n + .5, Y(b.lo) - Y(b.hi)); }
    ctx.fillStyle = C.marker;
    ctx.fillRect(X(t.hit.day) - pw / n * .55, padT, pw / n * 1.1, ph);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.8; ctx.lineJoin = "round"; ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = X(i), y = Y(t.vals[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const b = t.bands[i], out = i >= t.hit.day && i < t.hit.day + 4 && (!b || t.vals[i] > b.hi || t.vals[i] < b.lo);
      ctx.fillStyle = out ? C.alert : C.ink; ctx.beginPath(); ctx.arc(X(i), Y(t.vals[i]), out ? 4 : 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }
  function show(i) {
    cur = i;
    [...tabsEl.children].forEach((b, k) => { b.setAttribute("aria-selected", k === i ? "true" : "false"); b.tabIndex = k === i ? 0 : -1; });
    const target = TARGETS[i];
    const eventDate = md(lastDate(target, target.hit.day));
    document.getElementById("chart-panel").setAttribute("aria-labelledby", tabsEl.children[i].id);
    document.getElementById("chart-title").textContent = target.label;
    document.getElementById("chart-range").textContent = md(lastDate(target, 0)) + "〜" + md(today) + " ／ " + target.vals.length + "日間";
    const value = fmt(target.vals[target.hit.day]) + target.series.unit;
    document.getElementById("chart-event").innerHTML = "<strong>異常検知 " + eventDate + "</strong>　" + value;
    draw();
  }
  const tabsEl = document.getElementById("tabs");
  TARGETS.forEach((t, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.id = "tab-" + t.id;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-controls", "chart-panel");
    b.textContent = t.site;
    b.addEventListener("click", () => show(i));
    b.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        const k = (i + (e.key === "ArrowRight" ? 1 : TARGETS.length - 1)) % TARGETS.length;
        show(k); tabsEl.children[k].focus();
      }
    });
    tabsEl.appendChild(b);
  });
  applyFilter();
  renderKpis();
  show(cur);
  new ResizeObserver(draw).observe(cv);
  document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
